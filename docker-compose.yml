services:
  pdftoword:
    build:
      context: .
    image: pdftoword-doclayout-easyocr:latest
    ports:
      - "8000:8000"
    environment:
      DOCLAYOUT_CONF: ${DOCLAYOUT_CONF:-0.20}
      DOCLAYOUT_IMGSZ: ${DOCLAYOUT_IMGSZ:-1024}
      OCR_LANG: ${OCR_LANG:-ch_sim,en}
      OCR_CPU_THREADS: ${OCR_CPU_THREADS:-1}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      CONVERSION_TIMEOUT: ${CONVERSION_TIMEOUT:-1800}
    volumes:
      - hf-cache:/root/.cache/huggingface
      - easyocr-cache:/root/.EasyOCR
    restart: unless-stopped

volumes:
  hf-cache:
  easyocr-cache:
