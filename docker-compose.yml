services:
  pdftoword:
    build: .
    image: pdftoword-paddleocr-yolo:latest
    ports:
      - "8000:8000"
    environment:
      PADDLE_DEVICE: ${PADDLE_DEVICE:-cpu}
      OCR_LANG: ${OCR_LANG:-ch}
      DOCLAYOUT_CONF: ${DOCLAYOUT_CONF:-0.20}
      DOCLAYOUT_IMGSZ: ${DOCLAYOUT_IMGSZ:-1024}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-4}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    volumes:
      - paddle-cache:/root/.paddleocr
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped
volumes:
  paddle-cache:
  hf-cache:
