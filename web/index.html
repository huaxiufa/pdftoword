<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="app-version" content="2026-09-07-gemini-v1">
<title>PDF → Word · Gemini</title>
<style>
body{font-family:Arial,"Microsoft YaHei",sans-serif;max-width:760px;margin:80px auto;padding:20px;color:#111827}
.card{border:1px solid #e5e7eb;border-radius:14px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.05)}
button{padding:11px 22px;border:0;border-radius:8px;background:#111827;color:white;cursor:pointer;margin-left:8px}
button:disabled{opacity:.5;cursor:not-allowed}.bar{height:12px;background:#eee;margin:24px 0;border-radius:8px;overflow:hidden}.fill{height:100%;width:0;background:#2563eb;transition:.2s}.muted{color:#6b7280}.version{font-size:12px;color:#9ca3af;margin-top:28px}input{max-width:100%}
</style>
</head>
<body>
<div class="card">
<h1>PDF → 可编辑 Word</h1>
<p class="muted">Gemini 负责理解和重建排版，PDF 原始图片直接回填，最后由 LibreOffice 生成 DOCX。</p>
<input id="file" type="file" accept="application/pdf">
<button id="go">开始转换</button>
<div class="bar"><div id="fill" class="fill"></div></div>
<div id="msg">请选择 PDF。</div>
<div class="version">Engine: Gemini · Renderer: HTML + LibreOffice · Build: 2026-09-07-gemini-v1</div>
</div>
<script>
const $=id=>document.getElementById(id);
$('go').onclick=async()=>{
 const f=$('file').files[0];
 if(!f)return $('msg').textContent='请先选择 PDF。';
 $('go').disabled=true;$('msg').textContent='上传中…';
 const fd=new FormData();fd.append('file',f);
 const r=await fetch('/convert',{method:'POST',body:fd});
 if(!r.ok){$('msg').textContent=await r.text();$('go').disabled=false;return}
 const {task_id}=await r.json();
 const timer=setInterval(async()=>{
  const p=await (await fetch('/progress/'+task_id,{cache:'no-store'})).json();
  $('fill').style.width=(p.percent||0)+'%';$('msg').textContent=p.message||'';
  if(p.status==='done'){clearInterval(timer);$('msg').textContent='转换完成，正在下载…';location.href='/result/'+task_id}
  if(p.status==='error'){clearInterval(timer);$('msg').textContent='失败：'+p.message;$('go').disabled=false}
 },700);
};
</script>
</body>
</html>
