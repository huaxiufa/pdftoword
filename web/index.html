<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF → Word</title><style>body{font-family:Arial,"Microsoft YaHei",sans-serif;max-width:720px;margin:80px auto;padding:20px}button{padding:10px 20px;cursor:pointer}.bar{height:12px;background:#eee;margin:20px 0}.fill{height:100%;width:0;background:#2563eb;transition:.2s}.muted{color:#666}</style></head><body><h1>PDF → 可编辑 Word</h1><p class="muted">EasyOCR + DocLayout-YOLO</p><input id="file" type="file" accept="application/pdf"><button id="go">开始转换</button><div class="bar"><div id="fill" class="fill"></div></div><div id="msg">请选择 PDF。</div><script>const $=id=>document.getElementById(id);$('go').onclick=async()=>{const f=$('file').files[0];if(!f)return $('msg').textContent='请先选择 PDF。';$('go').disabled=true;$('msg').textContent='上传中…';const fd=new FormData();fd.append('file',f);const r=await fetch('/convert',{method:'POST',body:fd});if(!r.ok){$('msg').textContent=await r.text();$('go').disabled=false;return}const {task_id}=await r.json();const timer=setInterval(async()=>{const p=await (await fetch('/progress/'+task_id)).json();$('fill').style.width=(p.percent||0)+'%';$('msg').textContent=(p.message||'')+(p.current_page?`（${p.current_page}/${p.total_pages}）`: '');if(p.status==='done'){clearInterval(timer);$('msg').textContent='转换完成，正在下载…';location.href='/result/'+task_id;$('go').disabled=false}if(p.status==='error'){clearInterval(timer);$('msg').textContent='失败：'+p.message;$('go').disabled=false}},700)};</script></body></html>
