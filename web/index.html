<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF → Word V5</title>
  <style>
    body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f7fb;margin:0;color:#172033}
    .wrap{max-width:760px;margin:70px auto;padding:0 20px}.card{background:#fff;border-radius:18px;padding:36px;box-shadow:0 12px 40px rgba(20,30,60,.08)}
    h1{margin:0 0 10px}.sub{color:#687386;line-height:1.7}.box{border:2px dashed #c9d1df;border-radius:14px;padding:28px;margin:28px 0;text-align:center}
    input{max-width:100%}button{margin-top:18px;border:0;border-radius:10px;padding:12px 24px;background:#2563eb;color:white;font-size:16px;cursor:pointer}button:disabled{opacity:.5}
    .bar{height:10px;background:#e9edf4;border-radius:99px;overflow:hidden;margin-top:22px}.fill{height:100%;width:0;background:#2563eb;transition:width .3s}
    #status{margin-top:14px;color:#526075}.hint{font-size:13px;color:#8a94a6;margin-top:18px}
  </style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>PDF → Word V5 高保真版</h1>
  <div class="sub">V5 不再重新解释 PDF 的字体、图片、透明蒙版、头像裁剪和复杂图形，而是直接使用 PyMuPDF 按 PDF 页面最终显示效果渲染，再原尺寸放入 Word 页面。目标是最大限度保持原 PDF 的视觉效果。</div>
  <div class="box">
    <input id="file" type="file" accept="application/pdf">
    <br><button id="go">开始转换</button>
    <div class="bar"><div id="fill" class="fill"></div></div>
    <div id="status">等待上传 PDF</div>
  </div>
  <div class="hint">V5：PyMuPDF page rendering → exact-size DOCX page image · Build 2026-09-08-pdftoword-v5</div>
</div></div>
<script>
const fileEl=document.getElementById('file'), go=document.getElementById('go'), statusEl=document.getElementById('status'), fill=document.getElementById('fill');
function setProgress(p,msg){fill.style.width=(p||0)+'%';statusEl.textContent=msg||''}
go.onclick=async()=>{
  if(!fileEl.files[0]){statusEl.textContent='请先选择 PDF';return}
  go.disabled=true; setProgress(2,'正在上传…');
  const fd=new FormData(); fd.append('file',fileEl.files[0]);
  try{
    const r=await fetch('/convert',{method:'POST',body:fd}); const data=await r.json();
    if(!r.ok) throw new Error(data.detail||'上传失败');
    const task=data.task_id;
    const timer=setInterval(async()=>{
      try{
        const p=await fetch('/progress/'+task,{cache:'no-store'}).then(x=>x.json()); setProgress(p.percent,p.message);
        if(p.status==='done'){clearInterval(timer);setProgress(100,'转换完成，正在下载…');window.location='/result/'+task}
        if(p.status==='error'){clearInterval(timer);throw new Error(p.message||'转换失败')}
      }catch(e){clearInterval(timer);statusEl.textContent='失败：'+e.message;go.disabled=false}
    },700)
  }catch(e){statusEl.textContent='失败：'+e.message;go.disabled=false}
}
</script>
</body>
</html>
