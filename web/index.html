<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Toolbox</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f6f7fb;margin:0;color:#111827}.wrap{max-width:1000px;margin:60px auto;padding:24px}.hero{text-align:center;margin-bottom:40px}.hero h1{font-size:44px;margin:0 0 12px}.hero p{color:#6b7280;font-size:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;box-shadow:0 6px 25px #00000008}.card h3{margin:0 0 8px}.card p{color:#6b7280;font-size:14px;min-height:38px}.btn{display:inline-block;background:#111827;color:#fff;border:0;border-radius:10px;padding:11px 15px;cursor:pointer}.status{margin-top:15px;font-size:13px}.download{display:block;margin-top:12px}.drop{border:2px dashed #d1d5db;border-radius:14px;padding:18px;text-align:center;margin:10px 0}.drop input{width:100%}</style></head><body><main class="wrap"><section class="hero"><h1>PDF Toolbox</h1><p>免费、快速的 PDF 基础处理与格式转换工具</p></section><section class="grid" id="grid"></section></main><script>const tools=[['merge','PDF 合并','合并多个 PDF 文件'],['split','PDF 拆分','按页面拆成多个 PDF'],['extract','提取页面','提取指定页面'],['rotate','旋转 PDF','90° / 180° / 270°'],['compress','PDF 压缩','减小文件体积'],['pdf-to-word','PDF → Word','Gemini 智能识别排版'],['pdf-to-excel','PDF → Excel','Gemini 智能识别表格'],['pdf-to-images','PDF → 图片','导出 PNG 页面'],['images-to-pdf','图片 → PDF','PNG/JPG 合成 PDF']];const grid=document.querySelector('#grid');for(const [id,name,desc] of tools){const c=document.createElement('div');c.className='card';c.innerHTML=`<h3>${name}</h3><p>${desc}</p><div class="drop"><input type="file" id="f-${id}" ${id==='merge'||id==='images-to-pdf'?'multiple':''} accept="${id==='images-to-pdf'?'image/*':'.pdf'}"></div>${id==='extract'?'<input id="p-'+id+'" placeholder="页码，如 1,3-5">':''}${id==='rotate'?'<select id="a-'+id+'"><option>90</option><option>180</option><option>270</option></select>':''}<button class="btn" onclick="runTool('${id}')">开始处理</button><div class="status" id="s-${id}"></div>`;grid.appendChild(c)}async function runTool(id){const status=document.querySelector('#s-'+id), input=document.querySelector('#f-'+id);if(!input.files.length){status.textContent='请先选择文件';return}const fd=new FormData();for(const f of input.files)fd.append('files',f);if(id==='extract')fd.append('pages',document.querySelector('#p-extract').value);if(id==='rotate')fd.append('angle',document.querySelector('#a-rotate').value);status.textContent='处理中…';try{const r=await fetch('/api/v1/tools/'+id,{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw Error(d.detail||'处理失败');status.innerHTML=`完成：<a class="download" href="${d.download_url}">下载结果</a>`}catch(e){status.textContent=e.message}}</script></body></html>
